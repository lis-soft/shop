server
{
	listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.constructdigital.in www.constructdigital.la www.tdigitalsgconstruc.top www.contructdigital.com www.constructdigitalsg.com constructdigital.la constructdigital.in contructdigital.com tdigitalsgconstruc.top constructdigitalsg.com www.constructdigitalg.com constructdigitalg.com www.constructdigital.cc constructdigital.cc constructdigitalcl.us www.constructdigitalcl.us;

    # Keep each user-facing site on a single origin. Safari/iOS is especially
    # strict when the page origin and credentialed API/RUM requests differ only
    # by the www prefix.
    set $redirect_www_to_apex 0;
    set $apex_host $host;
    if ($host ~* ^www\.(.+)$) {
        set $redirect_www_to_apex 1;
        set $apex_host $1;
    }
    if ($uri ~ /\.well-known/) {
        set $redirect_www_to_apex 0;
    }
    if ($redirect_www_to_apex = 1) {
        return 301 https://$apex_host$request_uri;
    }

    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/audle/user/dist;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/8.218.109.157_9001.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/8.218.109.157_9001/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/8.218.109.157_9001/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/8.218.109.157_9001/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;





    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.tdigitalsgconstruc.top https://api.constructdigitalsg.com https://api.salesmartly.com https://msg.salesmartly.com https://msg-ws.salesmartly.com https://srz.salesmartly.com https://*.salesmartly.com wss://*.salesmartly.com https://mix-ads.oss-accelerate.aliyuncs.com; script-src 'self' 'unsafe-inline' https://plugin-code.salesmartly.com https://*.salesmartly.com https://static.cloudflareinsights.com; script-src-elem 'self' 'unsafe-inline' https://plugin-code.salesmartly.com https://*.salesmartly.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://plugin-code.salesmartly.com https://*.salesmartly.com; style-src-elem 'self' 'unsafe-inline' https://plugin-code.salesmartly.com https://*.salesmartly.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data: https:; frame-src 'self' https://*.salesmartly.com; object-src 'none'; base-uri 'self';" always;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/8.218.109.157_9001.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # Runtime config should not be cached, otherwise users may keep an old API domain.
    location = /runtime-config.js {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        expires -1;
    }

    # Same-origin API proxy for the user frontend.
    location ^~ /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Language, Captcha-Key" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Captcha-Key" always;
        add_header Vary Origin always;
        proxy_pass http://127.0.0.1:10303;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Serve backend uploads through the same domain as the frontend.
    location ^~ /uploads/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        proxy_pass http://127.0.0.1:10303;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Vue Router history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cloudflare Browser Insights posts here. If Cloudflare does not intercept
    # it on a given host, return a harmless empty response instead of SPA HTML.
    location = /cdn-cgi/rum {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        return 204;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/8.218.109.157_9001.log;
    error_log  /www/wwwlogs/8.218.109.157_9001.error.log;
}
