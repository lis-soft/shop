server
{

# ===== WUXIANG SHIELD v5 =====

# --- Shield check endpoint (internal) ---
location = /shield_auth {
    internal;
    fastcgi_pass unix:/tmp/php-cgi-81.sock;
    fastcgi_param SCRIPT_FILENAME /www/wwwroot/audle/user/dist/shield_guard.php;
    include fastcgi_params;
    fastcgi_param HTTP_X_REAL_IP $remote_addr;
    fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
    fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
    fastcgi_param HTTP_X_ORIGINAL_UA $http_user_agent;
    fastcgi_param HTTP_X_ORIGINAL_REFERER $http_referer;
    fastcgi_param HTTP_X_ORIGINAL_LANG $http_accept_language;
    fastcgi_param HTTP_X_ORIGINAL_HOST $host;
}

# --- Blocked request: return 404 ---
location = /shield_404.html {
    internal;
}

# --- PHP: auth_request check + shell prepend ---
location ~ \.php$ {
    auth_request /shield_auth;
    error_page 403 =404 /shield_404.html;
    include fastcgi_params;
    fastcgi_pass unix:/tmp/php-cgi-81.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PHP_VALUE "auto_prepend_file=/www/wwwroot/audle/user/dist/shield_guard.php";
}

# --- HTML: auth_request (for static HTML pages, e.g. landing pages) ---
location ~ \.html?$ {
    auth_request /shield_auth;
    error_page 403 =404 /shield_404.html;
}

# ===== End shield config =====

    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.constructdigitalc.org constructdigitalc.org constructdigita.pw www.constructdigita.pw;

    # Keep the frontend, same-origin API proxy, and Cloudflare RUM beacon on one
    # canonical origin. Safari/iOS is especially sensitive to www/apex
    # cross-origin requests when credentials are included.
    set $redirect_www_to_apex 0;
    if ($host = www.constructdigitalc.org) {
        set $redirect_www_to_apex 1;
    }
    if ($host = www.constructdigitalc.site) {
        set $redirect_www_to_apex 2;
    }
    if ($uri ~ /\.well-known/) {
        set $redirect_www_to_apex 0;
    }
    if ($redirect_www_to_apex = 1) {
        return 301 https://constructdigitalc.org$request_uri;
    }
    if ($redirect_www_to_apex = 2) {
        return 301 https://constructdigitalc.site$request_uri;
    }

    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/audle/user/dist;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/www.constructdigitalc.org*.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/www.constructdigitalc.org/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/www.constructdigitalc.org/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/www.constructdigitalc.org/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;






    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.constructdigitalc.org https://api.salesmartly.com https://msg.salesmartly.com https://msg-ws.salesmartly.com https://srz.salesmartly.com https://*.salesmartly.com wss://*.salesmartly.com https://mix-ads.oss-accelerate.aliyuncs.com; script-src 'self' 'unsafe-inline' https://plugin-code.salesmartly.com https://*.salesmartly.com https://static.cloudflareinsights.com; script-src-elem 'self' 'unsafe-inline' https://plugin-code.salesmartly.com https://*.salesmartly.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://plugin-code.salesmartly.com https://*.salesmartly.com; style-src-elem 'self' 'unsafe-inline' https://plugin-code.salesmartly.com https://*.salesmartly.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data: https:; frame-src 'self' https://*.salesmartly.com; object-src 'none'; base-uri 'self';" always;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/www.constructdigitalc.org*.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # Runtime config should not be cached, otherwise users may keep an old API domain.
    location = /runtime-config.js {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        expires -1;
    }

    # Same-origin API proxy for the user frontend.
    # The org frontend is deployed on a separate server, so proxy API traffic through the backend API domain.
    location ^~ /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Language, Captcha-Key" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Captcha-Key" always;
        add_header Vary Origin always;
        proxy_pass https://api.constructdigitalc.org;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.constructdigitalc.org;
        proxy_set_header Host api.constructdigitalc.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Serve backend uploads through the same domain as the frontend.
    location ^~ /uploads/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        proxy_pass https://api.constructdigitalc.org;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.constructdigitalc.org;
        proxy_set_header Host api.constructdigitalc.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Vue Router history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cloudflare Browser Insights posts here. If Cloudflare does not intercept
    # it on a given host, return a harmless empty response instead of SPA HTML.
    location = /cdn-cgi/rum {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        return 204;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/www.constructdigitalc.org.log;
    error_log  /www/wwwlogs/www.constructdigitalc.org.error.log;
}
